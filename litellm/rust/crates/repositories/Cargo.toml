[package]
name = "litellm-repositories"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Rust repositories for the auth objects the proxy reads from Postgres on a cache miss"

[dependencies]
chrono.workspace = true
litellm-db.workspace = true
litellm-error.workspace = true
litellm-python-compat.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
sqlx.workspace = true
tracing.workspace = true

[dev-dependencies]
rstest.workspace = true
tokio = { workspace = true, features = ["macros", "rt"] }
